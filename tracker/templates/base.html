<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Series Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Series Tracker</a>
  <nav aria-label="Main">
    <a href="/">Following</a>
    <a href="/search">Search</a>
    <a href="/manual">Add by hand</a>
    <a href="/review">Needs review{% if review_count %} <span class="badge">{{ review_count }}</span>{% endif %}</a>
  </nav>
  <form class="theme" method="post" action="/theme">
    <input type="hidden" name="next" value="{{ request.url.path }}">
    <fieldset><legend class="sr">Theme</legend>
      {% for t in ['system', 'light', 'dark'] %}<button name="theme" value="{{ t }}" aria-pressed="{{ 'true' if theme == t else 'false' }}">{{ t | capitalize }}</button>{% endfor %}
    </fieldset>
  </form>
</header>
<main>
  {% if msg %}<p class="flash" role="status">{{ msg }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
